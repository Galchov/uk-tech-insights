<table width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; padding: 30px; border-radius: 8px;">
                <tr>
                    <td align="center" style="font-size: 24px; font-weight: bold; color: #333333;">
                        Welcome to Your Site!
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 20px; font-size: 16px; color: #555555;">
                        Hi {{ user.username }},
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 10px; font-size: 16px; color: #555555;">
                        Thank you for registering! Please confirm your email by clicking the button below.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding-top: 30px;">
                        <a href="{{ activation_link }}" style="background-color: #007bff; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 4px; display: inline-block; font-size: 16px;">
                            Confirm Email
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 30px; font-size: 14px; color: #999999;">
                        If you didn’t request this, you can safely ignore this email.
                    </td>
                </tr>
                <tr>
                    <td style="padding-top: 20px; font-size: 12px; color: #cccccc;">
                        &copy; {{ current_year }} UK Tech Insights. All rights reserved.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
