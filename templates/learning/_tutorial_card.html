<div class="card-equal">

  {% if tutorial.cover_image %}
    <div class="card-img">
      <img src="{{ tutorial.cover_image.url }}" alt="{{ tutorial.title }}">
    </div>
  {% endif %}

  <div class="card-body">
    <h5>
      <a href="{{ tutorial.get_absolute_url }}" class="text-decoration-none text-dark">
        {{ tutorial.title }}
      </a>
    </h5>

    <p class="text-muted small mb-1">
      {{ tutorial.created_at|date:"Y-m-d" }} •
      <span class="badge bg-secondary">{{ tutorial.get_difficulty_display }}</span>
    </p>

    <p class="summary">{{ tutorial.summary }}</p>
  </div>
</div>
