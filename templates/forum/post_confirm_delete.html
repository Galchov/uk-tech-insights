{% extends 'forum/base_forum.html' %}

{% block title %}Delete Post | UK Tech Insights{% endblock %}

{% block forum_content %}

<p>Are you sure you want to delete "{{ object.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm</button>
</form>
{% endblock %}
