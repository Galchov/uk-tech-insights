{% extends 'common/base.html' %}

{% block content %}
<div class="mx-auto border p-4 mt-4" style="max-width: 500px;">
    <h5 class="mb-4 text-center">Delete Industry</h5>
    <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-between">
            <a href="{% url 'industries:industry_list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Delete</button>
        </div>
    </form>
</div>
{% endblock %}
