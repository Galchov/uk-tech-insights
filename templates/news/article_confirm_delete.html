{% extends 'common/base.html' %}
{% block title %}Delete Article{% endblock %}

{% block content %}
<div class="container">
  <h1 class="mb-4">Confirm Deletion</h1>

  <p>Are you sure you want to delete the article <strong>{{ object.title }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="#" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
