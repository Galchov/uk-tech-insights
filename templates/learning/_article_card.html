<div class="card-equal">

  {% if article.cover_image %}
    <div class="card-img">
      <img src="{{ article.cover_image.url }}" alt="{{ article.title }}">
    </div>
  {% endif %}

  <div class="card-body">
    <h5>
      <a href="{{ article.get_absolute_url }}" class="text-decoration-none text-dark">
        {{ article.title }}
      </a>
    </h5>

    <p class="text-muted small mb-1">
      {% for author in article.authors.all %}
        {{ author.get_full_name|default:author.username }}{% if not forloop.last %}, {% endif %}
      {% empty %}Unknown{% endfor %}
      • {{ article.created_at|date:"Y-m-d" }}
    </p>

    <p class="summary">{{ article.summary }}</p>
  </div>
</div>
