{% extends 'common/base.html' %}
{% block title %}Delete Article{% endblock %}

{% block content %}
<div class="container py-5">
  <h1 class="mb-4">Confirm Deletion</h1>

  <div class="alert alert-warning">
    <p>
      Are you sure you want to permanently delete the article 
      <strong>{{ object.title }}</strong>?
    </p>
    <p>This action cannot be undone.</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'news:article_detail' object.slug %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
