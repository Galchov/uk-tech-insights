{% extends 'forum/base_forum.html' %}

{% block title %}Posts Categories | UK Tech Insights{% endblock %}

{% block forum_content %}
<h2>Categories</h2>

{% for category in categories %}
<div>
    <h3>{{ category.name }}</h3>
    <p>{{ category.description }}</p>
</div>
<hr>
{% empty %}
<p>No categories available.</p>
{% endfor %}
{% endblock %}
