{% extends 'common/base.html' %}

{% block title %}News API{% endblock %}

{% block content %}
<div class="container py-5">
  <h2 class="mb-4 text-center">News API Endpoints</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>Method</th>
          <th>Endpoint</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>GET</td>
          <td><code>/api/news/articles/</code></td>
          <td>List all news articles</td>
        </tr>
        <tr>
          <td>GET</td>
          <td><code>/api/news/articles/&lt;slug&gt;/</code></td>
          <td>Retrieve a single article by slug</td>
        </tr>
      </tbody>
    </table>
  </div>

  <p class="mt-3 text-center">
    <a href="{% url 'api_docs:public_api' %}" class="btn btn-outline-secondary">Back to Public API</a>
  </p>
</div>
{% endblock %}
