<div class="card mb-5" style="max-width: 100%; min-height: 300px;">
  <div class="card-body d-flex flex-column h-100">

    <div class="d-flex align-items-start mb-2 flex-shrink-0" style="min-height: 120px;">
      {% if article.cover_image %}
        <div class="me-3" style="flex-shrink: 0;">
          <img src="{{ article.cover_image.url }}"
               alt="{{ article.title }}"
               class="rounded shadow-sm"
               style="width: 100px; height: 100px; object-fit: cover;">
        </div>
      {% endif %}

      <div class="d-flex flex-column" style="flex-grow: 1;">
        <div style="overflow: hidden;">
          <h4 class="card-title mb-1" style="white-space: normal; overflow: hidden;">
            {{ article.title }}
          </h4>
        </div>

        <div style="overflow: hidden;">
          <p class="card-text mb-0 small text-muted">
            {% for author in article.authors.all %}
              {{ author.get_full_name|default:author.username }}{% if not forloop.last %}, {% endif %}
            {% empty %}
              Unknown
            {% endfor %}
            • {{ article.created_at|date:"M d, Y" }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex-grow-1 overflow-hidden" style="max-height: 90px;">
      <p class="card-text">
        {{ article.summary }}
      </p>
    </div>

    <div class="mt-auto flex-shrink-0">
      <a href="{{ article.get_absolute_url }}" class="btn btn-primary btn-sm">Read more</a>
    </div>

  </div>
</div>
