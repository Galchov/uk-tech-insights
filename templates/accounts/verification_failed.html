{% extends 'common/base.html' %}

{% block content %}
<h2>Verification Failed ❌</h2>
<p>You are missing the following requirements:</p>
<ul>
  {% for item in missing %}
    <li>{{ item }}</li>
  {% endfor %}
</ul>
<p>Please update your profile with the missing information and try again.</p>
<a href="{% url 'accounts:profile_edit' user.pk %}">Update Profile</a>
{% endblock %}
