{% extends 'forum/base_forum.html' %}

{% block title %}Delete Post | UK Tech Insights{% endblock %}

{% block forum_content %}
<div class="mx-auto border p-4" style="max-width: 500px;">
    <h2 class="text-center mb-3">Delete Post</h2>
    <p class="text-center text-danger"><strong>Warning:</strong> This action is permanent and cannot be undone.</p>
    <p class="text-center">Are you sure you want to delete "<strong>{{ object.title }}</strong>"?</p>

    <form method="post" class="text-center mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">Confirm</button>
        <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
