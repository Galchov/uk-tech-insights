{% extends 'common/base.html' %}

{% block title %}Delete Account | UK Tech Insights{% endblock %}

{% block content %}
<h1>Delete Your Account</h1>

<p><strong>Warning:</strong> This action is permanent and cannot be undone. All your data, contributions, and preferences will be deleted.</p>

<form method="post" action="{% url 'accounts:delete_account' user.pk %}">
    {% csrf_token %}

    <div>
        <input type="checkbox" name="confirm_delete" id="id_confirm_delete" required>
        <label for="id_confirm_delete">I understand that this action is irreversible and wish to proceed.</label>
    </div>

    <div>
        <button type="submit">Delete My Account</button>
        <a href="{% url 'accounts:dashboard' pk=request.user.pk %}">Cancel</a>
    </div>
</form>
{% endblock %}
