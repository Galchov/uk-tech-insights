{% extends 'common/base.html' %}

{% block title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="mx-auto border p-4 mt-4" style="max-width: 700px;">
    <h2 class="text-center mb-4">Delete {{ company.name }}</h2>
    <p class="text-danger text-center">
        Are you sure you want to delete <strong>{{ company.name }}</strong> permanently?
    </p>

    <form method="post" class="text-center mt-4">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger me-2">Confirm</button>
        <a href="{% url 'companies:company_detail' company.slug %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
