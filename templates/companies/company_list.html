{% extends 'common/base.html' %}

{% block title %}Companies | UK Tech Insights{% endblock %}

{% block content %}
<div class="space-y-6">
    {% if user.is_staff %}
    <div>
        <a href="{% url 'companies:company_add' %}">Add Company</a>
    </div>
    {% endif %}

    {% for company in companies %}
    <div>
        <div>
        {% include 'companies/_company_card.html' with company=company %}
        </div>
    </div>
    {% endfor %}

</div>
{% endblock %}
