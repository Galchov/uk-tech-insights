{% extends 'common/base.html' %}

{% block title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-3">Delete "{{ location.name }}"</h2>
    <p class="text-danger">Are you sure you want to permanently delete <strong>{{ location.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'locations:location_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
